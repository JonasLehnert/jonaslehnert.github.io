<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>
  <meta name="description" content="{{ site.description }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&display=swap">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/site.css">

  <!-- Icons -->
  <link rel="shortcut icon" href="{{ site.baseurl }}/public/favicon.ico">
  <!-- Structured data: tells search engines who this page is about -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Jonas Lehnert",
    "url": "{{ site.url }}",
    "image": "{{ site.url }}/public/images/profile.jpg",
    "jobTitle": "Postdoctoral Fellow",
    "description": "{{ site.description }}",
    "worksFor": { "@type": "Organization", "name": "University of Ottawa" },
    "alumniOf": { "@type": "CollegeOrUniversity", "name": "McGill University" },
    "knowsAbout": ["Neuroscience", "Serotonin", "Visual attention", "Decision making", "Computational neuroscience"],
    "sameAs": ["{{ site.scholar }}", "{{ site.linkedin }}", "{{ site.github }}"]
  }
  </script>
  <link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
</head>
