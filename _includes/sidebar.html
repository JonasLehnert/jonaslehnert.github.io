<aside class="sidebar">
  <div class="sidebar-inner">
    <img class="profile-photo" src="{{ site.baseurl }}/public/images/profile.jpg" alt="Photo of {{ site.title }}">

    <h1 class="name">{{ site.title }}</h1>
    <p class="role">{{ site.role }}</p>
    <p class="tagline">{{ site.description }}</p>

    <nav class="links" aria-label="Contact and profiles">
      <a href="mailto:{{ site.email }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v.4l8 5 8-5V7H4Zm16 2.8-7.5 4.7a1 1 0 0 1-1 0L4 9.8V17h16V9.8Z"/></svg>
        <span>Email</span>
      </a>
      <a href="{{ site.scholar }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3Zm-6 9.9V16c0 1.7 2.7 4 6 4s6-2.3 6-4v-3.1l-6 3.3-6-3.3Z"/></svg>
        <span>Google Scholar</span>
      </a>
      <a href="{{ site.linkedin }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.5h4V21H3V9.5Zm6.5 0h3.8v1.6h.1c.5-1 1.8-2 3.8-2 4 0 4.8 2.6 4.8 6V21h-4v-5.1c0-1.2 0-2.8-1.7-2.8s-2 1.3-2 2.7V21h-4V9.5Z"/></svg>
        <span>LinkedIn</span>
      </a>
      <a href="{{ site.github }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg>
        <span>GitHub</span>
      </a>
    </nav>
  </div>

  <p class="footer">&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
</aside>
